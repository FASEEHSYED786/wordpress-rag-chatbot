[project]
name = "wordpress-rag-chatbot"
version = "0.1.0"
description = "Python RAG backend plus WordPress plugin that answers questions from your site content"
requires-python = ">=3.10"
[project.optional-dependencies]
dev = ["pytest"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
